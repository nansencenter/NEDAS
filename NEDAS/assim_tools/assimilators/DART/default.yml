# path to libdartkernels.so (build_dart_kernels.sh); empty = alongside the code
dart_lib:

# which DART obs_increment kernel to use:
#   EAKF      ensemble adjustment Kalman filter (deterministic; matches NEDAS's native EAKF)
#   ENKF      stochastic EnKF with perturbed observations
#   KERNEL    kernel filter (stochastic)
#   PARTICLE  observation-space particle filter
#   RHF       rank histogram filter (unbounded)
#   GAMMA     gamma-distributed prior/likelihood
#   BNRHF     bounded normal rank histogram filter (uses the bounds below)
#   KDE       kernel density estimator filter (uses the bounds below)
filter_kind: EAKF

# seed for DART's random sequence, used by the stochastic kernels (ENKF, KERNEL).
# 0 derives one from the analysis time, which is the same on every rank -- required, since
# every rank computes the increment for the same observation -- while changing each cycle,
# so the perturbations are not replayed. Set a fixed non-zero value to pin a run instead.
random_seed: 0

# --- DART namelist options -------------------------------------------------------------
# DART keeps these in its namelists rather than in the kernel arguments, so NEDAS writes
# them into an input.nml in the working directory for DART to read. Only the kernels that
# actually consult them (ENKF, RHF, KDE) trigger this; the rest never initialize DART at
# all, which is what keeps EAKF bit-comparable with the native implementation.
#
# True lets NEDAS write that input.nml; an input.nml it did not write is never overwritten.
# Set False to supply your own, which must then provide &utilities_nml and &assim_tools_nml.
# DART also writes dart_log.out and dart_log.nml into that directory.
write_input_nml: True

sort_obs_inc: True               # ENKF: sort increments to minimize the regression error
rectangular_quadrature: True     # RHF: rectangular vs trapezoidal quadrature
gaussian_likelihood_tails: False # RHF: gaussian tails for the likelihood
quadrature_order: 9              # KDE: Gauss-Legendre quadrature order

# Not supported yet: DART also needs its correction table (sampling_error_correction_table.nc)
# staged at runtime, which NEDAS does not do. Setting this True raises rather than silently
# regressing with an unpopulated table.
sampling_error_correction: False

# bounds for the bounded kernels (BNRHF, KDE); ignored by the others
bounded_below: False
bounded_above: False
lower_bound: 0.0
upper_bound: 1.0
