# Lorenz (2005) Model III with the parameters of the paper and of DAPPER; I: 1 gives Model II
# (DART lorenz_04 uses coupling: 3)
nx: 960
K: 32
I: 12
space_time_scale: 10.  # b in the paper
coupling: 2.5  # c in the paper
F: 15.
dt: 0.002  # time step (model time units); rk4 is stable up to about 0.004
hours_per_unit_time: 120.  # 0.05 time units = 6 h, as in Lorenz (1996)

# --- common to the small models (see NEDAS/models/ode_model.py) ---
restart_dt: 6  # restart interval (hours)
spinup_time: 5.0  # model time from the perturbed x0 to a state on the attractor
init_sd: 1.0  # standard deviation of the perturbation added to x0 before the spinup
# initial ensemble: 'climatology' = independently spun up states (seed + 1 + member),
#                   'truth' = the truth at time_start plus noise of init_ens_sd
init_ens_mode: climatology
init_ens_sd: 1.0
seed: 0  # random seed of the truth

nproc_per_run: 1
nproc_per_util: 1
walltime: 10
ens_init_dir:
truth_dir:
