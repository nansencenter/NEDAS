# Lorenz (1963): dx/dt = sigma (y - x), dy/dt = rho x - y - x z, dz/dt = x y - beta z
sigma: 10.
rho: 28.
beta: 2.6666666666666665
dt: 0.01  # time step (model time units)
hours_per_unit_time: 24.  # 0.25 time units per 6-hourly cycle

# --- common to the small models (see NEDAS/models/ode_model.py) ---
restart_dt: 6  # restart interval (hours)
spinup_time: 10.0  # model time from the perturbed x0 to a state on the attractor
init_sd: 1.0  # standard deviation of the perturbation added to x0 before the spinup
# initial ensemble: 'climatology' = independently spun up states (seed + 1 + member),
#                   'truth' = the truth at time_start plus noise of init_ens_sd
init_ens_mode: climatology
init_ens_sd: 1.0
seed: 0  # random seed of the truth

nproc_per_run: 1
nproc_per_util: 1
walltime: 10
ens_init_dir:
truth_dir:
