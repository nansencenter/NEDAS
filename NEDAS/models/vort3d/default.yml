nproc_per_run: 1
nproc_per_util: 1
ens_init_dir: ''
ens_run_strategy: scheduler
walltime: 100

nx: 200   # grid dimensions (paper: 200x200)
ny: 200

dx: 20000  # grid spacing, in meters (paper: 20 km)

nz: 2   # number of free-atmosphere layers (paper: 2 -- upper troposphere +
        # lower/mid troposphere). Total prognostic layers = nz+1 (always
        # +1 boundary layer at the bottom). nz=2 uses the paper's own exact
        # sigma levels; other nz use equal-sigma-thickness free-tropospheric
        # layers (see core.make_sigma_levels).

dt: 15   # internal model integration time step in seconds (paper: 15s)

restart_dt: 1  # model restart output interval in hours

output_dt: null  # sub-cycle output interval, hours -- if set and shorter than a given run()
                 # call's forecast_period (cycle_period), the model writes intermediate full-
                 # state snapshots every output_dt hours WITHIN the cycle, without changing
                 # cycle_period itself (the DA scheme's own checkpointing/next-cycle logic still
                 # runs at cycle_period). null (default) disables this -- one write per cycle,
                 # as before.

dt_reduction_factor: 0.5  # adaptive dt: on a NaN blowup, retry the same forecast
                          # segment from the same starting state at dt * this factor, up to
                          # max_dt_retries times, before giving up (same RuntimeError as before)
max_dt_retries: 3        # number of dt-reduction retries; 0 disables adaptive dt entirely,
                          # reproducing the original fail-immediately-on-NaN behavior
min_dt: null              # floor for the retries; null uses dt * dt_reduction_factor**max_dt_retries

beta: 0.0   # Coriolis beta parameter, df/dy, /m/s (0 = pure f-plane, matching
            # the paper's own experiments; e.g. 2.3e-11 for beta-drift near 20N)

f0: 4.98802e-05  # reference Coriolis parameter, /s, at beta=0/y=0 -- default is
                 # 2*7.292e-5*sin(20 deg), the paper's own fixed-latitude assumption

moist: true  # if false, run the dry dynamical core only (no surface fluxes,
             # radiative cooling, condensation, or convection)

convection_scheme: ooyama  # 'ooyama' (the paper's own closure, only valid
                            # for nz=2) or 'betts_miller' (simplified
                            # Betts/Betts-Miller column relaxation, valid
                            # for any nz -- see core.py module docstring)

Vbg: 0.       # background flow wind speed (std), m/s (0 = calm, matching the
              # paper's own experiments)
Vslope: -3.   # background flow kinetic energy spectrum power law

bg_seed: null  # RNG seed for the background flow; null uses the ensemble
               # member index in generate_init_ensemble (independent
               # per-member background-flow realization)

Vmax: 15.0     # initial vortex peak tangential wind speed, m/s (smith_vortex's own default)
Rmw: 120000.0  # initial vortex radius of maximum wind, m (smith_vortex's own default)

vortex_x0: 0.0        # initial (truth) vortex center, m, relative to the domain center
vortex_y0: -700000.0  # default displaces it toward the southern boundary, giving it room
                      # to drift poleward/zonally over a long integration
pos_sprd: 100000.0    # ensemble initial vortex position spread, m -- each member's
                      # center is drawn from a Gaussian with this std around
                      # (vortex_x0,vortex_y0), matching vort2d's loc_sprd exactly (NOT a
                      # uniform draw); truth always uses the exact configured center
                      # (pos_sprd=0 override)

u_bkg: 0.0  # uniform (spatially-constant) steering flow, m/s, added on top of Vbg's
v_bkg: 0.0  # turbulent background flow -- default off (0); see core.py's Core docstring
            # for why a uniform flow is a distinct mechanism from Vbg (persists/steers
            # rather than getting sheared apart by the vortex)

theta_sprd: 0.0  # ensemble spread (Gaussian std, K), domain-uniform boundary-layer-only
                 # theta perturbation per member -- default off (0); free-atmosphere
                 # layers (incl. the top) are never perturbed regardless
q_sprd: 0.0      # same, for boundary-layer q, kg/kg -- default off (0)

Vmax_sprd: 0.0  # ensemble spread (Gaussian std, m/s) for the initial vortex's own
                # Vmax per member -- default off (0); floored at 1 m/s
Rmw_sprd: 0.0   # ensemble spread (Gaussian std, m) for the initial vortex's own Rmw
                # per member -- default off (0); floored at 10 km
