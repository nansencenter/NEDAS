# Kuramoto-Sivashinsky, defaults of DAPPER
nx: 128
DL: 32.  # domain length in units of pi
dt: 0.25  # time step (model time units)
hours_per_unit_time: 6.  # 1 time unit (DAPPER's observation interval in Bocquet 2019) per 6 h

# --- common to the small models (see NEDAS/models/ode_model.py) ---
restart_dt: 6  # restart interval (hours)
spinup_time: 150.0  # model time from the perturbed x0 to a state on the attractor
init_sd: 0.1  # standard deviation of the perturbation added to x0 before the spinup
# initial ensemble: 'climatology' = independently spun up states (seed + 1 + member),
#                   'truth' = the truth at time_start plus noise of init_ens_sd
init_ens_mode: climatology
init_ens_sd: 0.1
seed: 0  # random seed of the truth

nproc_per_run: 1
nproc_per_util: 1
walltime: 10
ens_init_dir:
truth_dir:
