dataset_dir: '/cluster/projects/nn2993k/sim/data/OSISAF_ice_drift'

# osisaf grid parameters
proj_name: 'nh_polstere'
proj: '+proj=stere +a=6378273 +b=6356889.44891 +lat_0=90 +lat_ts=70 +lon_0=-45'
xstart: -3750000.
xend: 3626000.
dx: 62500.
ystart: 5750000.
yend: -5251000.
dy: -62500.

obs_file_dt: 24  #time interval (hours) between obs files

use_dataset_uncertainty: False  # if True, use per-pixel 'uncert_dX_and_dY' field from file instead of err.std
use_adaptive_err: False  # if True, use min(drift_err_cap, 4*uncert_dX_and_dY^2) cf. read_OSISAF_data_lv4 in enkf-topaz; overrides use_dataset_uncertainty
drift_err_cap: 49.0  # km^2, error variance cap from idrft_osisaf.hdr (2-day OSISAF drift product, used post-2009)