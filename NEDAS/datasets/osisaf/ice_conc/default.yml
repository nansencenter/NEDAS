dataset_dir:

proj_name: 'nh_polstere'
proj: '+proj=stere +a=6378273 +b=6356889.44891 +lat_0=90 +lat_ts=70 +lon_0=-45'
xstart: -3845000.
xend: 3755000.
dx: 10000.
ystart: 5845000.
yend: -5355000.
dy: -10000.

source: amsr2   # multi
obs_file_dt: 24 # time interval (hours) between obs files

use_dataset_uncertainty: False  # if True, use per-pixel 'total_uncertainty' field from file instead of err.std
use_adaptive_err: False  # if True, use concentration-dependent adaptive error (cf. TOPAZ enkf-topaz formula), overridden by use_dataset_uncertainty